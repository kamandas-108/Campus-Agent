version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campus_ai_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: campus_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_ai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DSN=postgresql://postgres:password@db:5432/campus_ai_db
      # ── Telegram ──────────────────────────────────────────────────────────
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - FACULTY_DASHBOARD_URL=${FACULTY_DASHBOARD_URL:-http://localhost:3000}
      # ── Email (SMTP) ───────────────────────────────────────────────────────
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-true}
      - MAIL_SSL_TLS=${MAIL_SSL_TLS:-false}
      - FACULTY_APPROVAL_EMAIL=${FACULTY_APPROVAL_EMAIL:-}
      # PUBLIC_API_URL must be reachable from OUTSIDE Docker (faculty click
      # the approve/reject links from their email client). Set this to your
      # server's public address or ngrok URL during local dev.
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
      - APPROVAL_ACTION_SECRET=${APPROVAL_ACTION_SECRET:-}
      # ── Twilio / WhatsApp ─────────────────────────────────────────────────
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER:-whatsapp:+14155238886}
      - ADMIN_WHATSAPP_NUMBER=${ADMIN_WHATSAPP_NUMBER:-}
      - TWILIO_WHATSAPP_CONTENT_SID=${TWILIO_WHATSAPP_CONTENT_SID:-}
      - TWILIO_WHATSAPP_APPROVAL_CONTENT_SID=${TWILIO_WHATSAPP_APPROVAL_CONTENT_SID:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_ai_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Inside Docker, the frontend server-side code must reach the backend
      # via the container name. For browser (client-side) fetches the value
      # is baked into the Next.js build, so keep it as the public address.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  postgres_data:
